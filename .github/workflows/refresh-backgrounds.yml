name: Refresh launcher backgrounds

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-launcher-backgrounds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch landscape backgrounds
        run: node scripts/refresh-backgrounds.mjs
      - name: Commit catalog changes
        shell: bash
        run: |
          if git diff --quiet -- backgrounds.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backgrounds.json
          git commit -m "Refresh launcher backgrounds"
          git push
